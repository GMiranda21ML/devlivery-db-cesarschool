<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produto - Dev-livery</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="fluxo.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body data-page="pedido">
    <header class="navbar">
        <div class="container navbar-content">
            <a href="index.html" class="logo text-link">
                <i class="fa-solid fa-motorcycle"></i>
                <h1>Dev-livery</h1>
            </a>
            <div class="nav-actions">
                <a href="carrinho.html" class="btn-icon text-link" aria-label="Carrinho">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span>Carrinho</span>
                    <span class="cart-badge" data-cart-count>0</span>
                </a>
                <a href="meus-pedidos.html" class="btn-icon text-link" aria-label="Meus pedidos">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span>Meus Pedidos</span>
                </a>
            </div>
        </div>
    </header>

    <main class="container fluxo-page">
        <a href="#" class="back-link" id="pedido-back-link">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Voltar para o restaurante</span>
        </a>

        <section class="order-layout">
            <div class="section-card product-spotlight" id="order-product-details"></div>

            <aside class="section-card order-summary-card">
                <div class="section-header">
                    <div>
                        <p class="eyebrow">Configuracao</p>
                        <h2>Adicionar ao carrinho</h2>
                    </div>
                </div>

                <div class="qty-control">
                    <span>Quantidade</span>
                    <div class="qty-actions">
                        <button type="button" class="qty-btn" id="decrease-qty">-</button>
                        <span id="quantity-value">1</span>
                        <button type="button" class="qty-btn" id="increase-qty">+</button>
                    </div>
                </div>

                <label class="order-note-label" for="order-note">Observacoes</label>
                <textarea id="order-note" class="order-note" placeholder="Ex: sem cebola, ponto da carne, molho a parte..."></textarea>

                <div class="price-breakdown" id="price-breakdown"></div>

                <button class="btn-primary order-confirm-btn" id="confirm-order-btn">
                    Adicionar ao Carrinho
                </button>
            </aside>
        </section>
    </main>

    <script src="fluxo.js"></script>
</body>
</html>
