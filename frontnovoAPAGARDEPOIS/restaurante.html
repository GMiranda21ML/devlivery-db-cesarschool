<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante - Dev-livery</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="fluxo.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body data-page="restaurante">
    <header class="navbar">
        <div class="container navbar-content">
            <a href="index.html" class="logo text-link">
                <i class="fa-solid fa-motorcycle"></i>
                <h1>Dev-livery</h1>
            </a>
            <div class="nav-actions">
                <a href="carrinho.html" class="btn-icon text-link" aria-label="Carrinho">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span>Carrinho</span>
                    <span class="cart-badge" data-cart-count>0</span>
                </a>
                <a href="meus-pedidos.html" class="btn-icon text-link" aria-label="Meus pedidos">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span>Meus Pedidos</span>
                </a>
                <a href="perfil.html" class="btn-icon text-link" aria-label="Perfil">
                    <i class="fa-regular fa-circle-user"></i>
                    <span>Perfil</span>
                </a>
            </div>
        </div>
    </header>

    <main class="container fluxo-page">
        <a href="index.html" class="back-link">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Voltar para restaurantes</span>
        </a>

        <section class="restaurant-hero" id="restaurant-hero"></section>

        <section class="restaurant-content">
            <div class="restaurant-main">
                <div class="section-card">
                    <div class="section-header">
                        <div>
                            <p class="eyebrow">Cardapio</p>
                            <h2>Produtos da loja</h2>
                        </div>
                    </div>
                    <div class="product-grid" id="product-list"></div>
                </div>
            </div>

            <aside class="restaurant-sidebar">
                <div class="section-card">
                    <div class="section-header">
                        <div>
                            <p class="eyebrow">Avaliacoes</p>
                            <h2>O que estao dizendo</h2>
                        </div>
                    </div>
                    <div class="rating-summary" id="rating-summary"></div>
                    <div class="review-list" id="review-list"></div>
                </div>
            </aside>
        </section>
    </main>

    <script src="fluxo.js"></script>
</body>
</html>
