<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Restaurante - Dev-livery</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/restaurante.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<!-- ===== NAVBAR ===== -->
<header class="navbar">
    <div class="container navbar-content">
        <a href="index.html" class="logo">
            <i class="fa-solid fa-motorcycle"></i>
            <h1>Dev-livery</h1>
        </a>
        <nav class="nav-links" id="nav-actions">
            <a href="login.html" class="btn-primary" id="login-btn" style="padding: 10px 20px; border-radius: 12px; text-decoration: none; font-weight: 700;">
                Entrar
            </a>
        </nav>
    </div>
</header>

<main class="container" style="padding-top: 24px; padding-bottom: 60px;">

    <!-- Botão voltar -->
    <a href="index.html" class="back-link">
        <i class="fa-solid fa-arrow-left"></i> Voltar para início
    </a>

    <!-- ===== HERO DO RESTAURANTE ===== -->
    <div class="rest-hero" id="restaurante-hero">

        <!-- Capa (cover) -->
        <div class="rest-hero__cover" id="rest-cover"></div>

        <!-- Corpo do header -->
        <div class="rest-hero__body">

            <!-- Avatar / logo do restaurante -->
            <div class="rest-hero__avatar" id="rest-avatar">
                <i class="fa-solid fa-store"></i>
            </div>

            <div class="rest-hero__main">
                <div class="rest-hero__text">
                    <h1 class="rest-hero__name" id="restaurante-nome">Carregando...</h1>
                    <div class="rest-hero__meta" id="rest-meta"></div>
                </div>
                <div class="rest-hero__actions" id="rest-actions"></div>
            </div>

            <!-- Faixa de informações -->
            <div class="rest-hero__info-strip" id="rest-info-strip">
                <div class="rest-info-item">
                    <i class="fa-solid fa-clock"></i>
                    <div>
                        <div style="color:#888;font-size:0.75rem;">Entrega estimada</div>
                        <strong id="rest-tempo">—</strong>
                    </div>
                </div>
                <div class="rest-info-item">
                    <i class="fa-solid fa-motorcycle"></i>
                    <div>
                        <div style="color:#888;font-size:0.75rem;">Taxa de entrega</div>
                        <strong>Grátis</strong>
                    </div>
                </div>
                <div class="rest-info-item">
                    <i class="fa-solid fa-star"></i>
                    <div>
                        <div style="color:#888;font-size:0.75rem;">Avaliação</div>
                        <strong id="rest-nota">—</strong>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== PRODUTOS ===== -->
    <section class="section-products">
        <div class="section-products__header">
            <h2 class="section-products__title">Cardápio</h2>
            <span class="section-products__count" id="produtos-count"></span>
        </div>

        <div id="produtos-container" class="products-loading">
            <div class="skeleton skeleton--product"></div>
            <div class="skeleton skeleton--product"></div>
            <div class="skeleton skeleton--product"></div>
        </div>
    </section>
</main>

<!-- FAB do carrinho -->
<button class="cart-fab" id="cart-fab" onclick="openCart()">
    <i class="fa-solid fa-cart-shopping"></i>
    Ver carrinho
    <span class="cart-fab__count" id="cart-fab-count">0</span>
</button>

<footer>
    <div class="container footer-content">
        <div class="footer-brand">
            <h2>Dev-livery</h2>
            <p>O melhor app para devs famintos.</p>
        </div>
    </div>
    <div class="container footer-bottom">
        <p>&copy; 2025 Dev-livery. Todos os direitos reservados.</p>
    </div>
</footer>

<script src="js/restaurante.js"></script>
</body>
</html>
