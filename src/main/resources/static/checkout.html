<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Dev-livery</title>
    <link rel="stylesheet" href="css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="auth-container">
    <div class="auth-card auth-card-large">
        <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Voltar para Home</a>

        <div class="logo">
            <i class="fa-solid fa-motorcycle"></i>
            <h1>Dev-livery</h1>
        </div>

        <h2>Finalizar Pedido</h2>

        <form class="auth-form" id="checkout-form">
            <div class="form-section">
                <h3>Resumo do Pedido</h3>

                <div id="cart-items" style="margin-bottom: 20px;">
                    <p>Carregando...</p>
                </div>

                <div class="cupom-area" style="margin: 20px 0; display: flex; gap: 10px;">
                    <select id="tipo-cupom" style="padding: 10px; border-radius: 5px; border: 1px solid #ccc; flex: 1;">
                        <option value="PERCENTUAL">Cupom 10% OFF</option>
                        <option value="FIXO">Desconto R$ 15 Fixo</option>
                    </select>
                    <button type="button" onclick="aplicarCupomBanco()" style="background: var(--primary-color); color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold;">
                        Aplicar Cupom
                    </button>
                </div>

                <div style="display: flex; justify-content: space-between; margin-top: 10px; color: #666; font-size: 16px;">
                    <span>Valor Original:</span>
                    <span>R$ <span id="valor-original">0.00</span></span>
                </div>

                <div style="display: flex; justify-content: space-between; font-size: 18px; font-weight: 700; margin-top: 10px; color: #1da55a;">
                    <span>Valor Final:</span>
                    <span>R$ <span id="valor-final">0.00</span></span>
                </div>
            </div>

            <button type="submit" class="btn-primary btn-block" style="margin-top: 30px;">Finalizar Pedido</button>
        </form>
    </div>
</div>

<script>
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    const token = localStorage.getItem('token');
    let valorComDesconto = null; // guarda o valor calculado pelo banco

    document.addEventListener('DOMContentLoaded', () => {
        if (!token) {
            window.location.href = 'login.html';
            return;
        }
        renderCart();
        const form = document.getElementById('checkout-form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            await finalizarPedido();
        });
    });

    function renderCart() {
        const container = document.getElementById('cart-items');
        const valorOriginalEl = document.getElementById('valor-original');
        const valorFinalEl = document.getElementById('valor-final');

        if (cart.length === 0) {
            container.innerHTML = '<p>Seu carrinho está vazio!</p>';
            valorOriginalEl.textContent = '0.00';
            valorFinalEl.textContent = '0.00';
            return;
        }

        let total = 0;
        let html = '';
        cart.forEach(item => {
            const subtotal = item.preco * item.quantidade;
            total += subtotal;
            html += `
                <div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee;">
                    <div>
                        <h4 style="margin: 0;">${item.nome}</h4>
                        <p style="margin: 0; color: #666; font-size: 14px;">Qtd: ${item.quantidade}</p>
                    </div>
                    <span style="font-weight: 500;">R$ ${subtotal.toFixed(2)}</span>
                </div>
            `;
        });

        container.innerHTML = html;
        valorOriginalEl.textContent = total.toFixed(2);
        valorFinalEl.textContent = total.toFixed(2);
        valorComDesconto = null; // reset ao re-renderizar
    }

    // Aciona a FUNCTION calcular_desconto_cupom no MySQL
    async function aplicarCupomBanco() {
        const valorPedido = parseFloat(document.getElementById('valor-original').textContent);

        if (!valorPedido || valorPedido <= 0) {
            alert('Adicione itens ao carrinho antes de aplicar o cupom.');
            return;
        }

        const tipoCupom = document.getElementById('tipo-cupom').value;
        const valorDesconto = tipoCupom === 'PERCENTUAL' ? 10 : 15;

        try {
            const response = await fetch(
                `/api/pedidos/simular-desconto?valorPedido=${valorPedido}&tipoCupom=${tipoCupom}&valorDesconto=${valorDesconto}`,
                {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                }
            );

            if (response.ok) {
                valorComDesconto = await response.json();
                document.getElementById('valor-final').textContent = valorComDesconto.toFixed(2);
                alert(`Cupom aplicado! Valor com desconto: R$ ${valorComDesconto.toFixed(2)}`);
            } else if (response.status === 403) {
                alert('Apenas clientes podem aplicar cupons. Faça login como cliente.');
            } else {
                alert('Falha ao calcular o desconto no servidor.');
            }
        } catch (error) {
            console.error('Erro na requisição do cupom:', error);
            alert('Erro ao conectar com o servidor.');
        }
    }

    async function finalizarPedido() {
        try {
            const decoded = parseJwt(token);
            if (!decoded) { alert('Sessão inválida. Faça login novamente.'); return; }

            const cdRestaurante = cart[0]?.cdRestaurante;
            if (!cdRestaurante) { alert('Carrinho inválido.'); return; }

            const data = {
                cpfCliente: decoded.sub,
                cdRestaurante: cdRestaurante,
                items: cart.map(item => ({
                    cdProduto: item.cdProduto,
                    quantidade: item.quantidade
                })),
                valorComDesconto: valorComDesconto
            };

            const response = await fetch('/api/pedidos', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                alert('Pedido finalizado com sucesso!');
                localStorage.removeItem('cart');
                window.location.href = 'index.html';
            } else {
                const error = await response.text();
                alert('Erro: ' + error);
            }
        } catch (error) {
            console.error('Erro:', error);
            alert('Erro ao conectar com o servidor');
        }
    }

    function parseJwt(token) {
        try {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(c =>
                '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
            ).join(''));
            return JSON.parse(jsonPayload);
        } catch (e) { return null; }
    }
</script>
</body>
</html>
