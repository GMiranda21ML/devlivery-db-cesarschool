<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Pedidos - Dev-livery</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/fluxo.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body data-page="pedidos">
<header class="navbar">
    <div class="container navbar-content">
        <a href="index.html" class="logo text-link">
            <i class="fa-solid fa-motorcycle"></i>
            <h1>Dev-livery</h1>
        </a>
        <div class="nav-actions">
            <a href="carrinho.html" class="btn-icon text-link" style="margin-right: 15px;">
                <i class="fa-solid fa-basket-shopping" style="color: #ea1d2c;"></i>
                <span>Carrinho</span>
            </a>
            <a href="perfil.html" class="btn-icon text-link">
                <i class="fa-regular fa-circle-user"></i>
                <span>Perfil</span>
            </a>
        </div>
    </div>
</header>

<main class="container fluxo-page">
    <section class="orders-hero-panel">
        <div class="orders-hero-copy">
            <p class="eyebrow">Painel do cliente</p>
            <h2>Meus pedidos</h2>
            <p class="orders-subtitle">Acompanhe tudo em um visual mais limpo, com status real do banco e resumo de cada compra.</p>
        </div>
        <div class="orders-hero-actions">
            <a href="carrinho.html" class="ghost-btn text-link">Ir para carrinho</a>
            <a href="log-pedidos.html" class="ghost-btn text-link" style="display:inline-flex;align-items:center;gap:8px;">
                <i class="fa-solid fa-bolt"></i> Log de Pedidos (Trigger)
            </a>
            <a href="index.html" class="btn-primary text-link orders-new-btn">Pedir novamente</a>
        </div>
    </section>

    <section class="orders-stats-grid" id="orders-stats"></section>

    <section class="section-card orders-header-card">
        <div class="orders-header compact">
            <div>
                <p class="eyebrow">Filtros rápidos</p>
                <h3>Filtrar pedidos</h3>
            </div>
        </div>
        <div class="orders-filters" id="orders-filters">
            <button class="filter-chip active" onclick="filtrarStatus('Todos')">Todos</button>
            <button class="filter-chip" onclick="filtrarStatus('Pendente')">Pendentes</button>
            <button class="filter-chip" onclick="filtrarStatus('Em preparo')">Em preparo</button>
            <button class="filter-chip" onclick="filtrarStatus('Saiu para entrega')">Saiu para entrega</button>
            <button class="filter-chip" onclick="filtrarStatus('Entregue')">Entregue</button>
        </div>
    </section>

    <section class="orders-list" id="orders-list"></section>
</main>

<script src="js/script.js"></script>
</body>
</html>
