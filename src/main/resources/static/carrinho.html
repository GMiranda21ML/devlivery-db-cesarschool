<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho - Dev-livery</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/fluxo.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body data-page="carrinho">
<header class="navbar">
    <div class="container navbar-content">
        <a href="index.html" class="logo text-link">
            <i class="fa-solid fa-motorcycle"></i>
            <h1>Dev-livery</h1>
        </a>
        <div class="nav-actions">
            <a href="meus-pedidos.html" class="btn-icon text-link">
                <i class="fa-solid fa-bag-shopping"></i>
                <span>Meus Pedidos</span>
            </a>
            <a href="perfil.html" class="btn-icon text-link">
                <i class="fa-regular fa-circle-user"></i>
                <span>Perfil</span>
            </a>
        </div>
    </div>
</header>

<main class="container fluxo-page">
    <a href="index.html" class="back-link">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Continuar comprando</span>
    </a>

    <section class="cart-layout">
        <div class="section-card">
            <div class="section-header">
                <div>
                    <p class="eyebrow">Revisao final</p>
                    <h2>Seu carrinho</h2>
                </div>
            </div>
            <div id="cart-items-list"></div>
        </div>

        <aside class="section-card cart-summary-card">
            <div class="section-header">
                <div>
                    <p class="eyebrow">Beneficios</p>
                    <h2>Cupom e resumo</h2>
                </div>
            </div>

            <div class="coupon-box">
                <label for="coupon-code" class="order-note-label">Cupom</label>
                <div class="coupon-row">
                    <input type="text" id="coupon-code" class="coupon-input" placeholder="Digite seu cupom">
                    <button type="button" class="coupon-btn" id="apply-coupon-btn">Aplicar</button>
                </div>
                <p class="coupon-message" id="coupon-message"></p>
            </div>

            <div class="price-breakdown" id="cart-summary"></div>

            <button class="btn-primary order-confirm-btn" id="cart-confirm-btn" onclick="finalizarPedido()">
                Confirmar Pedido
            </button>
        </aside>
    </section>
</main>

<script src="js/fluxo.js"></script>
</body>
</html>
