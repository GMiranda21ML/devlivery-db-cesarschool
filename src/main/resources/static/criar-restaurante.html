<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Restaurante - Dev-livery</title>
    <link rel="stylesheet" href="css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card auth-card-large">
            <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Voltar para Home</a>
            
            <div class="logo">
                <i class="fa-solid fa-motorcycle"></i>
                <h1>Dev-livery</h1>
            </div>

            <h2>Cadastrar Restaurante</h2>
            <p class="subtitle">Preencha os dados do seu restaurante</p>

            <form class="auth-form" id="criar-restaurante-form">
                <div class="form-section">
                    <h3>Dados do Restaurante</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="cnpj">CNPJ</label>
                            <input type="text" id="cnpj" placeholder="00.000.000/0000-00" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="cep">CEP</label>
                            <input type="text" id="cep" placeholder="00000-000" required>
                        </div>

                        <div class="form-group">
                            <label for="nome">Nome</label>
                            <input type="text" id="nome" placeholder="Nome do restaurante" required>
                        </div>

                        <div class="form-group">
                            <label for="telefone_restaurante">Telefone do Restaurante</label>
                            <input type="text" id="telefone_restaurante" required placeholder="(81) 99999-9999">
                        </div>

                        <div class="form-group">
                            <label for="cidade">Cidade</label>
                            <input type="text" id="cidade" placeholder="Sua cidade" required>
                        </div>

                        <div class="form-group">
                            <label for="rua">Rua</label>
                            <input type="text" id="rua" placeholder="Nome da rua" required>
                        </div>

                        <div class="form-group">
                            <label for="numero">Número</label>
                            <input type="text" id="numero" placeholder="Ex: 123" required>
                        </div>

                        <div class="form-group">
                            <label for="bairro">Bairro</label>
                            <input type="text" id="bairro" placeholder="Seu bairro" required>
                        </div>

                        <div class="form-group">
                            <label for="imagemRestaurante">Logo/Capa do Restaurante (PNG)</label>
                            <input type="file" id="imagemRestaurante" accept="image/png">
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-primary btn-block">Criar Restaurante</button>
            </form>
        </div>
    </div>
    
    <script>
        const maskCPF = (value) => {
            return value
                .replace(/\D/g, '')
                .replace(/(\d{3})(\d)/, '$1.$2')
                .replace(/(\d{3})(\d)/, '$1.$2')
                .replace(/(\d{3})(\d{1,2})/, '$1-$2')
                .replace(/(-\d{2})\d+?$/, '$1');
        };

        const maskCNPJ = (value) => {
            return value
                .replace(/\D/g, '')
                .replace(/(\d{2})(\d)/, '$1.$2')
                .replace(/(\d{3})(\d)/, '$1.$2')
                .replace(/(\d{3})(\d)/, '$1/$2')
                .replace(/(\d{4})(\d{1,2})/, '$1-$2')
                .replace(/(-\d{2})\d+?$/, '$1');
        };

        const maskCEP = (value) => {
            return value
                .replace(/\D/g, '')
                .replace(/(\d{5})(\d)/, '$1-$2')
                .replace(/(-\d{3})\d+?$/, '$1');
        };

        const maskPhone = (value) => {
            return value
                .replace(/\D/g, '')
                .replace(/(\d{2})(\d)/, '($1) $2')
                .replace(/(\d{5})(\d)/, '$1-$2')
                .replace(/(-\d{4})\d+?$/, '$1');
        };

        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                return JSON.parse(jsonPayload);
            } catch (e) {
                return null;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            const decoded = parseJwt(token);
            if (!decoded) {
                localStorage.removeItem('token');
                window.location.href = 'login.html';
                return;
            }

            const inputTelefone = document.getElementById('telefone_restaurante');
            if (inputTelefone) {
                inputTelefone.addEventListener('input', (e) => {
                    e.target.value = maskPhone(e.target.value);
                });
            }

            const cnpjInput = document.getElementById('cnpj');
            if (cnpjInput) cnpjInput.addEventListener('input', (e) => e.target.value = maskCNPJ(e.target.value));

            const cepInput = document.getElementById('cep');
            if (cepInput) cepInput.addEventListener('input', (e) => e.target.value = maskCEP(e.target.value));

            const form = document.getElementById('criar-restaurante-form');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const dadosRestaurante = {
                    cpf: decoded.sub,
                    nome: document.getElementById('nome').value,
                    cnpj: document.getElementById('cnpj').value,
                    telefone: document.getElementById('telefone_restaurante').value,
                    numero: document.getElementById('numero').value,
                    cep: document.getElementById('cep').value,
                    bairro: document.getElementById('bairro').value,
                    rua: document.getElementById('rua').value,
                    cidade: document.getElementById('cidade').value
                };

                try {
                    const res = await fetch('/api/restaurantes/cadastro', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify(dadosRestaurante)
                    });

                    if (res.ok) {
                        const restauranteId = await res.text();
                        
                        const fileInput = document.getElementById('imagemRestaurante');
                        if (fileInput.files.length > 0) {
                            const formData = new FormData();
                            formData.append('imagem', fileInput.files[0]);
                            
                            await fetch(`/api/restaurantes/${restauranteId}/imagem`, {
                                method: 'POST',
                                headers: { 'Authorization': `Bearer ${token}` },
                                body: formData
                            });
                        }

                        alert('Restaurante criado com sucesso!');
                        window.location.href = 'painel-restaurante.html';
                    } else {
                        const errorMsg = await res.text();
                        alert('Erro: ' + errorMsg);
                    }
                } catch (error) {
                    console.error('Erro:', error);
                    alert('Erro de conexão com o servidor.');
                }
            });
        });
    </script>
</body>
</html>
