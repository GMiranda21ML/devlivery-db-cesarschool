<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Parceiro | DevLivery</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/painel.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<nav class="navbar">
    <div class="nav-brand nav-brand-clickable" onclick="window.location.href='index.html'">
        <i class="fa-solid fa-burger nav-brand-icon"></i>
        <span class="nav-brand-text">Dev<span class="nav-brand-highlight">Livery</span> Parceiros</span>
    </div>
    <div class="nav-actions" id="nav-actions">
    </div>
</nav>

<div class="dashboard-container">
    <div class="header-painel">
        <div class="header-info">
            <h1 id="nome-restaurante">Carregando restaurante...</h1>
            <p>Gerencie seus pedidos e faturamento.</p>
        </div>
        <div class="header-acoes">
            <button class="btn-procedure" onclick="recalcularNotas()">
                <i class="fa-solid fa-star"></i> Recalcular Notas (Procedure MySQL)
            </button>
        </div>
    </div>

    <div class="metric-cards">
        <div class="metric-card metric-faturamento">
            <h3 class="metric-title"><i class="fa-solid fa-money-bill-trend-up"></i> Faturamento Total</h3>
            <h2 id="valor-faturamento" class="metric-value faturamento-valor">R$ 0,00</h2>
            <p class="metric-subtitle">Pedidos concluídos</p>
        </div>
        <div class="metric-card metric-pedidos">
            <h3 class="metric-title"><i class="fa-solid fa-bell"></i> Pedidos na Fila</h3>
            <h2 id="qtd-pedidos" class="metric-value pedidos-valor">0</h2>
            <p class="metric-subtitle">Aguardando preparo</p>
        </div>
    </div>

    <h2><i class="fa-solid fa-clock"></i> Pedidos Pendentes (Query 2)</h2>
    <div id="lista-pedidos-pendentes" class="pedidos-grid">
        <p>Carregando pedidos...</p>
    </div>
</div>

<script src="js/script.js"></script>
<script>
    let cdRestauranteLogado = null;
    const tokenPainel = localStorage.getItem('token');

    async function inicializarPainel() {
        if (!tokenPainel) {
            window.location.href = 'login.html';
            return;
        }

        const decoded = parseJwt(tokenPainel);
        if(decoded.role !== 'parceiro') {
            alert('Acesso negado. Apenas parceiros podem acessar esta página.');
            window.location.href = 'index.html';
            return;
        }

        const cpfParceiro = decoded.sub;

        try {
            const resRestaurante = await fetch(`/api/restaurantes/${cpfParceiro}`, {
                headers: { 'Authorization': `Bearer ${tokenPainel}` }
            });

            if (resRestaurante.ok) {
                const restaurante = await resRestaurante.json();
                cdRestauranteLogado = restaurante.cdRestaurante;
                document.getElementById('nome-restaurante').textContent = `Painel: ${restaurante.nome}`;

                carregarPedidosPendentes();
                carregarFaturamento();
            } else {
                alert('Você ainda não cadastrou um restaurante!');
                window.location.href = 'criar-restaurante.html';
            }
        } catch (error) {
            console.error("Erro ao carregar o painel:", error);
        }
    }

    async function carregarPedidosPendentes() {
        if(!cdRestauranteLogado) return;

        try {
            const response = await fetch(`/api/pedidos/restaurante/${cdRestauranteLogado}/pendentes`, {
                headers: { 'Authorization': `Bearer ${tokenPainel}` }
            });

            const container = document.getElementById('lista-pedidos-pendentes');

            if (response.ok) {
                const pedidos = await response.json();
                document.getElementById('qtd-pedidos').textContent = pedidos.length;

                if (pedidos.length === 0) {
                    container.innerHTML = '<p class="empty-state">Nenhum pedido pendente no momento.</p>';
                    return;
                }

                container.innerHTML = '';
                pedidos.forEach(pedido => {
                    container.innerHTML += `
                        <div class="pedido-card">
                            <div class="pedido-header">
                                <strong>Pedido #${pedido.cdPedido}</strong>
                                <span class="badge-pendente">Pendente</span>
                            </div>
                            <p class="pedido-info"><i class="fa-solid fa-user"></i> <strong>Cliente CPF:</strong> ${pedido.cpfCliente}</p>
                            <p class="pedido-info"><i class="fa-solid fa-calendar"></i> <strong>Data:</strong> ${pedido.data}</p>
                            <h3 class="pedido-valor-total">R$ ${pedido.valorTotal.toFixed(2).replace('.', ',')}</h3>

                            <button class="btn-acao btn-preparo" onclick="aceitarPedido(${pedido.cdPedido})">
                                <i class="fa-solid fa-fire-burner"></i> Aceitar e Preparar
                            </button>
                        </div>
                    `;
                });
            }
        } catch (error) {
            console.error('Erro ao buscar pedidos:', error);
        }
    }

    async function carregarFaturamento() {
        try {
            const response = await fetch(`/api/pedidos/restaurante/${cdRestauranteLogado}/faturamento`, {
                headers: { 'Authorization': `Bearer ${tokenPainel}` }
            });
            if(response.ok) {
                const faturamento = await response.json();
                document.getElementById('valor-faturamento').textContent = `R$ ${faturamento.toFixed(2).replace('.', ',')}`;
            }
        } catch (error) {
            console.error("Erro faturamento:", error);
        }
    }

    async function aceitarPedido(cdPedido) {
        if(!confirm('Deseja mover este pedido para "Em preparo"? O histórico será gravado no banco.')) return;

        try {
            const response = await fetch(`/api/pedidos/${cdPedido}/status`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${tokenPainel}`
                },
                body: JSON.stringify({ status: 'Em preparo' })
            });

            if (response.ok) {
                alert('Pedido aceito! Procedure executada com sucesso.');
                carregarPedidosPendentes();
            } else {
                alert('Erro ao atualizar o status do pedido no banco de dados.');
            }
        } catch (error) {
            console.error('Erro:', error);
        }
    }

    async function recalcularNotas() {
        if(!confirm('Deseja recalcular a nota de todos os produtos do seu restaurante usando a Procedure do Banco?')) return;

        try {
            const response = await fetch(`/api/restaurantes/${cdRestauranteLogado}/recalcular-notas`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${tokenPainel}` }
            });

            if (response.ok) {
                alert('Sucesso! As notas dos produtos foram recalculadas no banco pelo Cursor.');
            } else {
                alert('Erro ao executar a Procedure no banco.');
            }
        } catch (error) {
            console.error('Erro:', error);
        }
    }

    document.addEventListener('DOMContentLoaded', inicializarPainel);
</script>
</body>
</html>
